# Codex CLI — loyiha-darajali MCP konfiguratsiyasi (trusted project talab qilinadi).
# Token configda yo'q: env_vars orqali muhitdagi SUPABASE_ACCESS_TOKEN uzatiladi,
# Supabase MCP server uni o'zi o'qiydi.

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.78", "--headless", "--isolated"]

[mcp_servers.supabase]
command = "npx"
args = ["-y", "@supabase/mcp-server-supabase@0.9.0"]
env_vars = ["SUPABASE_ACCESS_TOKEN"]
